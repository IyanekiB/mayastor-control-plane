name: Snapshot Rebuild Build Verification

on:
  push:
    branches:
      - feature/**
  pull_request:
    paths:
      - 'control-plane/agents/**'
      - '.github/workflows/snapshot-rebuild-test.yml'
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET_REGISTRY: openebs
  BRANCH: develop
  CI: 1

jobs:
  snapshot-rebuild-test:
    name: Snapshot Rebuild Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get remove -y '^dotnet-.*' || true
          sudo apt-get remove -y '^llvm-.*' || true
          sudo apt-get remove -y 'php.*' || true
          sudo apt-get remove -y azure-cli google-cloud-sdk || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo docker image prune --all --force
          echo "After cleanup:"
          df -h

      - name: Install Nix
        uses: cachix/install-nix-action@v31.3.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Nix path
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV

      - name: Pre-populate nix-shell
        run: nix-shell --arg devrustup true --run "echo 'Nix shell ready'" shell.nix

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: snapshot-rebuild

      - name: Setup Docker
        run: |
          # Ensure Docker is running
          sudo systemctl start docker || true
          docker version
          docker info

      - name: Pull required Docker images
        run: |
          # Pull io-engine image from OpenEBS
          docker pull openebs/mayastor-io-engine:develop

          # Pull Jaeger for tracing
          docker pull jaegertracing/all-in-one:latest

          # Verify images
          docker images | grep -E "(mayastor|jaeger)"

      - name: Setup Test Prerequisites
        run: |
          # Configure hugepages for io-engine (reduced for GitHub runners)
          sudo sysctl -w vm.nr_hugepages=512

          # Install kernel modules
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) || true

          # Load nvme_tcp module if available
          sudo modprobe nvme_tcp || echo "Warning: nvme_tcp module not available"

          # Show loaded modules
          lsmod | grep nvme || echo "No nvme modules loaded"

          # Check hugepages
          cat /proc/meminfo | grep Huge

      - name: Force test constants to use openebs/develop
        run: |
          cat > utils/utils-lib/src/test_constants.rs <<EOF
          /// Automatically generated by ROOT/scripts/rust/branch_ancestor.sh
          pub const TARGET_BRANCH: &str = "develop";
          pub const TARGET_REGISTRY: &str = "openebs";
          EOF
          cat utils/utils-lib/src/test_constants.rs

      - name: Build required binaries
        run: |
          nix-shell --arg devrustup true --run "
            cargo build --bin rest
            cargo build --bin core
            cargo build --bin agent-ha-node
            cargo build --bin agent-ha-cluster
            cargo build --bin io-engine
          "

      - name: Verify binaries exist
        run: |
          ls -la target/debug/rest
          ls -la target/debug/core
          ls -la target/debug/agent-ha-node
          ls -la target/debug/agent-ha-cluster
          ls -la target/debug/io-engine

      - name: Build and verify snapshot rebuild code
        env:
          RUST_LOG: info
          TARGET_REGISTRY: openebs
          BRANCH: develop
        run: |
          nix-shell --arg devrustup true --run "
            set -e  # Exit immediately if any command fails
            export TARGET_REGISTRY=openebs
            export BRANCH=develop

            # Build all binaries to verify compilation
            echo '� Building all binaries...'
            cargo build --bins

            # Build the test to verify it compiles
            echo '🔨 Building snapshot rebuild test...'
            cargo test --package agents --bin core snapshot_rebuild --no-run

            echo '✅ Build verification complete!'
            echo 'ℹ️  Note: Integration test requires full cluster (io-engine, etcd, etc.)'
            echo 'ℹ️  and cannot run on GitHub Actions standard runners.'
            echo 'ℹ️  See RUN_INTEGRATION_TESTS.md for local testing instructions.'
          "
        timeout-minutes: 20

      - name: Show Docker container logs on failure
        if: failure()
        run: |
          echo "=== Docker Containers ==="
          docker ps -a

          echo -e "\n=== Container Logs ==="
          for container in $(docker ps -aq); do
            echo -e "\n--- Logs for $container ---"
            docker logs $container 2>&1 | tail -100 || true
          done

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker ps -aq | xargs -r docker rm -f || true
          docker network ls -q | xargs -r docker network rm 2>/dev/null || true

  summary:
    name: Test Summary
    needs: snapshot-rebuild-test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "📊 Snapshot Rebuild Build Verification Summary"
          echo "=============================================="
          echo ""
          if [[ "${{ needs.snapshot-rebuild-test.result }}" == "success" ]]; then
            echo "✅ Snapshot rebuild build verification PASSED!"
            echo ""
            echo "Verification complete:"
            echo "  ✅ All required binaries built successfully"
            echo "  ✅ Snapshot rebuild test code compiles"
            echo "  ✅ No compilation or build errors"
            echo "  ✅ Code integrates properly with codebase"
            echo ""
            echo "ℹ️  Note: Full integration test requires cluster infrastructure"
            echo "ℹ️  (io-engine, etcd, Docker networking) that exceeds GitHub"
            echo "ℹ️  Actions standard runner capabilities."
            echo ""
            echo "ℹ️  Integration tests should be run:"
            echo "   - Locally (see RUN_INTEGRATION_TESTS.md)"
            echo "   - On self-hosted runners with proper resources"
            echo "   - By upstream CI when PR is submitted"
            echo ""
            echo "Ready for PR review!"
            exit 0
          else
            echo "❌ Build verification failed"
            echo ""
            echo "Status: ${{ needs.snapshot-rebuild-test.result }}"
            echo ""
            echo "Check the logs above for compilation or build errors."
            exit 1
          fi
