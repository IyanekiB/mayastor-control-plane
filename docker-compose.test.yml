version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: mayastor-etcd
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ETCD_UNSUPPORTED_ARCH=arm64
    networks:
      - mayastor-net

  rest-service:
    build:
      context: .
      dockerfile: Dockerfile.rest
    container_name: mayastor-rest
    depends_on:
      - etcd
    ports:
      - "8080:8080"
    environment:
      - ETCD_ENDPOINT=http://etcd:2379
      - RUST_LOG=info
    networks:
      - mayastor-net

networks:
  mayastor-net:
    driver: bridge
